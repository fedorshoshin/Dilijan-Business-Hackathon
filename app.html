<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the safe-area insets actually report values on iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleaner Armenia</title>
<meta name="description" content="Report polluted spots in Dilijan, clean them up, fund the work.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6B4A">

<!-- iOS ignores the manifest for these, so they are repeated here -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cleaner Armenia">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="app">

<div class="installbar" id="installbar" hidden></div>

<main id="screen"></main>

<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>

<div class="toast" id="toast" hidden></div>

<script src="js/geo.js"></script>
<!-- api.js talks to the server; remote.js wears the old store's interface over
     it and assigns Havak.store. Both must load before anything that does
     `var store = Havak.store` at parse time, which is every view. -->
<script src="js/api.js"></script>
<script src="js/remote.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/money.js"></script>
<script src="js/router.js"></script>
<!-- Leaflet is vendored, not loaded from a CDN: same origin means the service
     worker can cache it, and the map keeps working with no third party up. -->
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/map.js"></script>
<script src="js/media.js"></script>
<script src="js/work.js"></script>
<script src="js/views/auth.js"></script>
<script src="js/views/feed.js"></script>
<script src="js/views/newreport.js"></script>
<script src="js/views/myreports.js"></script>
<script src="js/views/spot.js"></script>
<script src="js/views/jobs.js"></script>
<script src="js/views/me.js"></script>
<script src="js/views/give.js"></script>
<script src="js/main.js"></script>
</body>
</html>
