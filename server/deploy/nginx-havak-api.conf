# Havak API — nginx reverse proxy. This is the live config, verbatim.
# Installed at /etc/nginx/sites-available/havak-api, symlinked into sites-enabled.
#
# Why port 8443 and not 443: this VPS already serves n8n on 443 for the same
# hostname. Giving the API its own port means nginx never has to choose between
# two apps on one server block, so a mistake here cannot take n8n down. The
# certificate is the one certbot already manages for 130.51.22.253.nip.io —
# reused deliberately, because every *.nip.io certificate is drawn from one
# shared Let's Encrypt quota and asking for a second would spend it for nothing.
#
# HTTP/2 is absent on purpose: the `http2` directive only exists in nginx
# 1.25.1+, and this box runs 1.24.0 (Ubuntu 24.04), where it is an unknown
# directive that stops nginx from starting at all.

# Brute-force brake on the two endpoints that verify a password. bcrypt is
# deliberately slow, so unthrottled attempts are also a cheap way to peg the CPU.
limit_req_zone $binary_remote_addr zone=havak_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=havak_link:10m rate=60r/m;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 130.51.22.253.nip.io;

    ssl_certificate     /etc/letsencrypt/live/130.51.22.253.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/130.51.22.253.nip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # No HSTS. It would pin the browser to HTTPS for every host under nip.io,
    # including strangers', and cannot be withdrawn before it expires.

    access_log /var/log/nginx/havak.access.log;
    error_log  /var/log/nginx/havak.error.log;

    # Media never passes through here: the client PUTs bytes straight to the
    # Supabase bucket using a signed URL from POST /media/upload-url, so nginx
    # only ever carries the small JSON that mints it.
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Deliberately NO add_header Access-Control-Allow-* here. FastAPI's
    # CORSMiddleware already sets them from ALLOWED_ORIGINS, and setting them in
    # both places sends the header twice — which browsers reject outright,
    # looking exactly like a server outage from the client side.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Guessable credentials: an email address and a password. Brake hard — this is
    # the zone that makes an online password guessing attack pointless.
    location ~ ^/auth/(login|signup|forgot)$ {
        limit_req zone=havak_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Emailed links. A separate, looser zone on purpose: these take a 32-byte
    # random token, so there is no guessing attack to slow down, and the tight
    # zone above would punish the wrong people — Dilijan households share one
    # address through NAT, so three people confirming their email on the same
    # evening would start getting 429s on a link that is perfectly good. The
    # server throttles repeat sends per account anyway (RESEND_AFTER), which is
    # the limit that actually matters here.
    location ~ ^/auth/(verify|reset)(/resend)?$ {
        limit_req zone=havak_link burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Uptime checks hit this; it queries the database on purpose. Kept out of the
    # access log because a 30-second monitor would otherwise be the whole file.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
